    <main>

        <form action="./confirmacion.html" class="formulario">
            <div class="title">
                <h2>Datos del usuario</h2>
                <div class="lineaVerde"></div>
            </div>

            <div class="datos">
                <label> Nombre y Apellido*
                    <input type="text" required placeholder="¿Cómo te llamas?">
                </label>
                <label> Email
                    <input type="email" placeholder="Ejemplo@gmail.com">
                </label>
                <label> Teléfono*
                    <input type="number" required placeholder="Solo numeros (Sin carácteres especiales ni espacios)">
                </label>
                <label> Edad
                    <input type="number" min="0" max="120" placeholder="Ingresá tu edad">
                </label>
            </div>

            <div class="title">
                <h2>Motivo del mensaje</h2>
                <div class="lineaVerde"></div>
            </div>

            <div class="datos">
                <select name="" id="">
                    <option value="" selected disabled>Seleccioná tu opción</option>
                    <option value="C">Consulta</option>
                    <option value="P">Propuesta</option>
                    <option value="R">Reclamo</option>
                    <option value="O">Otro...</option>
                </select>
            </div>

            <div class="title">
                <h2>Mensaje</h2>
                <div class="lineaVerde"></div>
            </div>

            <div class="datos">
                <label>Asunto
                    <textarea name="" placeholder="Resumí brevemente tu mensaje" id=""></textarea>
                </label>
                <label>Mensaje
                    <textarea name="" placeholder="Contanos los detalles de tu mensaje" id=""></textarea>
                </label>
            </div>

            <button type="reset">Reiniciar</button>
            <button type="submit">Enviar</button>
        </form>
